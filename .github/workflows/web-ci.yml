name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            package-lock.json
      # Some web tests spawn core scripts (profile-path-doctor-parity runs
      # doctor.mjs), which import the ROOT packages (js-yaml, dotenv). Without
      # them doctor.mjs dies on import and those tests fail on empty output.
      # --ignore-scripts: only the packages are needed, not the root postinstall.
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
